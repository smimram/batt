<!DOCTYPE html>
<html>
  <head>
    <title>BATT</title>
    <link rel="stylesheet" type="text/css" href="batt.css"/>
    <script type="text/javascript" src="fs.js"></script>
    <script type="text/javascript" src="batt.bc.js"></script>
  </head>
  <body>
    <h1 style="font-family: monospace;">/V\(o,o)/V\ BATT /V\(o,o)/V\</h1>
    <div id="editor">
      <select id="files" size="10"></select>
      <div id="input-wrap">
        <pre id="highlight" aria-hidden="true"></pre>
        <textarea id="input" spellcheck="false">id : {A : Type} → (x : A) → A
id x = x</textarea>
      </div>
    </div>
    <div id="buttons">
      <button id="clear">Clear</button>
      <button id="send">Send</button>
    </div>
    <textarea id="output" placeholder="Output will appear here..." readonly></textarea>
    <script>
      function ku(event) {
        if (event.keyCode == 13)
          document.getElementById("send").click();
      }
      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      const keywords = new Set(["Type", "U", "let", "in", "fun", "postulate", "open", "import", "refl", "tt", "true", "false", "bool_ind"]);
      // One combined regex: matching is done on raw text, pieces are escaped afterwards.
      const rules = [
        ["comment", /--[^\n]*/],
        ["ident",   /\p{L}[\p{L}\p{N}'\-_→]*/],
        ["symbol",  /->|::|[λρ∂Σ×⨂⊗♭𝄫≡≃→ₗᵣ⊥⊤∷]/],
        ["hole",    /\?|_/],
      ];
      const re = new RegExp(rules.map(([_, r]) => "(" + r.source + ")").join("|"), "gu");
      function highlight() {
        const input = document.getElementById("input");
        const hl = document.getElementById("highlight");
        const src = input.value;
        let out = "", last = 0;
        for (const m of src.matchAll(re)) {
          out += esc(src.slice(last, m.index));
          let cls = rules[m.slice(1).findIndex(g => g !== undefined)][0];
          if (cls == "ident") cls = keywords.has(m[0]) ? "keyword" : null;
          out += cls ? '<span class="' + cls + '">' + esc(m[0]) + "</span>" : esc(m[0]);
          last = m.index + m[0].length;
        }
        // Trailing newline so that a final empty line has height.
        hl.innerHTML = out + esc(src.slice(last)) + "\n";
        hl.scrollTop = input.scrollTop;
        hl.scrollLeft = input.scrollLeft;
      }
      function init() {
        const input = document.getElementById("input");
        input.onkeyup = ku;
        input.addEventListener("input", highlight);
        input.addEventListener("scroll", highlight);
        highlight();
      }
  </script>
  </body>
</html>
