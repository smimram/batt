<!DOCTYPE html>
<html>
  <head>
    <title>BATT</title>
    <link rel="stylesheet" type="text/css" href="batt.css"/>
    <script type="text/javascript" src="batt.bc.js"></script>
  </head>
  <body>
    <h1 style="font-family: monospace;">/V\(o,o)/V\ BATT /V\(o,o)/V\</h1>
    <textarea id="input">id : {A : Type} → (x : A) → A
id x = x</textarea>
    <div id="buttons">
      <button id="send">Send</button>
      <button id="clear">Clear</button>
    </div>
    <textarea id="output" placeholder="Output will appear here..." readonly></textarea>
  </body>
  <script>
    function ku(event) {
      if (event.keyCode == 13)
        document.getElementById("send").click();
    }
    function init() {
      document.getElementById("input").onkeyup = ku;
    }
  </script>
</html>
