name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install required packages
      run: |
        sudo sed -i 's/noble/resolute/g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get -y update
        sudo apt-get -y install ocaml ocaml-dune menhir libsedlex-ocaml-dev libmenhir-ocaml-dev libppx-deriving-ocaml-dev
    - name: Build
      run: dune build
    - name: Test
      run: dune runtest
